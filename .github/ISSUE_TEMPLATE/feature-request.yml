name: Feature request
description: Propose a focused user-facing or engineering improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and users affected
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware or protocol scope
      description: List affected devices, transports, SDKs, and required real-device validation.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I can help implement this change.
        - label: I can provide hardware validation.
