name: Android Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release-candidate:
    runs-on: windows-latest
    timeout-minutes: 60
    environment: release

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        shell: pwsh
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE: ${{ runner.temp }}\indigo-release.jks
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_RELEASE_KEYSTORE_BASE64)) {
            throw "ANDROID_RELEASE_KEYSTORE_BASE64 is not configured in the release environment."
          }
          [IO.File]::WriteAllBytes(
            $env:ANDROID_RELEASE_KEYSTORE,
            [Convert]::FromBase64String($env:ANDROID_RELEASE_KEYSTORE_BASE64)
          )

      - name: Build signed release and source delivery
        shell: pwsh
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ runner.temp }}\indigo-release.jks
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: .\Build.ps1 -Release -NonCommercial

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: indigo-observatory-release-candidate-${{ github.sha }}
          path: |
            bin/Installer/
            bin/Source/
          if-no-files-found: error
          retention-days: 14
