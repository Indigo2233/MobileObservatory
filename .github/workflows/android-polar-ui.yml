name: Polar workflow UI

on:
  workflow_dispatch:
    inputs:
      test_classes:
        description: Instrumentation classes to execute
        required: false
        default: com.indigo.mobileobservatory.ui.PolarWorkflowScreenInstrumentedTest,com.indigo.mobileobservatory.ui.PolarPreviewRenderingInstrumentedTest,com.indigo.mobileobservatory.ui.GuideScreenInstrumentedTest,com.indigo.mobileobservatory.ui.GuideWorkbenchInstrumentedTest

permissions:
  contents: read

concurrency:
  group: polar-ui-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify-polar-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Allow emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          chmod +x gradlew
      - name: Exercise the complete polar alignment screen
        uses: reactivecircus/android-emulator-runner@v2
        env:
          UI_TEST_CLASSES: ${{ inputs.test_classes }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/Run-PolarUiTests.sh
      - name: Upload UI results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polar-workflow-ui-${{ github.sha }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/reports/polar-ui-screenshots/
            app/build/reports/ui-crash.log
            app/build/reports/ui-app.log
            app/build/reports/guide-entry-screenshots/
          if-no-files-found: ignore
