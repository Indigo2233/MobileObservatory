name: Android Release Publish

# Builds a signed APK, generates update.json for the in-app updater, and
# publishes the GitHub Release that the update feed points at.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.7"
        required: true
      notes:
        description: "Release notes shown in the in-app update prompt"
        required: false
        default: ""
      mandatory:
        description: "Mark this update as required"
        type: boolean
        default: false
      enable_sequence:
        description: "Include the unfinished sequence feature (development only)"
        type: boolean
        default: false
      min_supported_version_code:
        description: "Minimum version code allowed to keep running (0 disables)"
        required: false
        default: "0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 90
    environment: release

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve release tag
        id: resolve-tag
        shell: pwsh
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          PUSH_TAG: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $tag = if ($env:EVENT_NAME -eq 'push') { $env:PUSH_TAG } else { $env:DISPATCH_TAG }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "A release tag is required."
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Decode release keystore
        shell: pwsh
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE: ${{ runner.temp }}\indigo-release.jks
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_RELEASE_KEYSTORE_BASE64)) {
            throw "ANDROID_RELEASE_KEYSTORE_BASE64 is not configured in the release environment."
          }
          [IO.File]::WriteAllBytes(
            $env:ANDROID_RELEASE_KEYSTORE,
            [Convert]::FromBase64String($env:ANDROID_RELEASE_KEYSTORE_BASE64)
          )

      - name: Decode legacy release keystore
        shell: pwsh
        env:
          ANDROID_RELEASE_OLD_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_OLD_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_OLD_KEYSTORE: ${{ runner.temp }}\indigo-release-legacy.jks
        run: |
          if ([string]::IsNullOrWhiteSpace($env:ANDROID_RELEASE_OLD_KEYSTORE_BASE64)) {
            throw "ANDROID_RELEASE_OLD_KEYSTORE_BASE64 is not configured in the release environment."
          }
          [IO.File]::WriteAllBytes(
            $env:ANDROID_RELEASE_OLD_KEYSTORE,
            [Convert]::FromBase64String($env:ANDROID_RELEASE_OLD_KEYSTORE_BASE64)
          )

      - name: Build signed release
        shell: pwsh
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ runner.temp }}\indigo-release.jks
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_OLD_KEYSTORE: ${{ runner.temp }}\indigo-release-legacy.jks
          ANDROID_RELEASE_OLD_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_OLD_STORE_PASSWORD }}
          ANDROID_RELEASE_OLD_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_OLD_KEY_ALIAS }}
          ANDROID_RELEASE_OLD_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_OLD_KEY_PASSWORD }}
        run: |
          $arguments = @("-Release", "-NonCommercial")
          if ('${{ inputs.enable_sequence }}' -eq 'true') { $arguments += "-ShowSequence" }
          & .\Build.ps1 @arguments

      - name: Write release notes
        id: write-notes
        shell: pwsh
        env:
          RELEASE_NOTES: ${{ inputs.notes }}
          RELEASE_TAG: ${{ steps.resolve-tag.outputs.tag }}
        run: |
          $path = Join-Path $env:RUNNER_TEMP "release-notes.md"
          $notes = $env:RELEASE_NOTES
          if ([string]::IsNullOrWhiteSpace($notes)) {
            $notes = "Indigo Observatory $env:RELEASE_TAG"
          }
          [IO.File]::WriteAllText($path, $notes, (New-Object System.Text.UTF8Encoding($false)))
          "file=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Generate update manifest
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.resolve-tag.outputs.tag }}
          RELEASE_NOTES_FILE: ${{ steps.write-notes.outputs.file }}
        run: |
          $rawMinimum = '${{ inputs.min_supported_version_code }}'
          $minimum = if ([string]::IsNullOrWhiteSpace($rawMinimum)) { 0 } else { [int]$rawMinimum }
          $manifestArgs = @{
            Tag                    = $env:RELEASE_TAG
            Repository             = $env:GITHUB_REPOSITORY
            NotesFile              = $env:RELEASE_NOTES_FILE
            MinSupportedVersionCode = $minimum
          }
          if ('${{ inputs.mandatory }}' -eq 'true') { $manifestArgs.Mandatory = $true }
          & .\scripts\Write-UpdateManifest.ps1 @manifestArgs

      - name: Upload release candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: indigo-observatory-release-${{ steps.resolve-tag.outputs.tag }}
          path: bin/Installer/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.resolve-tag.outputs.tag }}
          RELEASE_NOTES_FILE: ${{ steps.write-notes.outputs.file }}
        run: |
          $tag = $env:RELEASE_TAG
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists."
          }

          $assets = @()
          $assets += (Get-Item -LiteralPath "bin/Installer/IndigoObservatory_android.apk").FullName
          $assets += (Get-ChildItem -LiteralPath "bin/Installer" -Filter "IndigoObservatory_android_v*-build*.apk" -File).FullName
          $assets += (Get-ChildItem -LiteralPath "bin/Installer" -Filter "*.sha256" -File).FullName
          $assets += (Get-ChildItem -LiteralPath "bin/Installer" -Filter "*.build-info.txt" -File).FullName
          $assets += (Get-Item -LiteralPath "bin/Installer/update.json").FullName

          if (git rev-parse -q --verify "refs/tags/$tag") {
            gh release create $tag @assets --title $tag --notes-file $env:RELEASE_NOTES_FILE
          } else {
            gh release create $tag --target $env:GITHUB_SHA @assets --title $tag --notes-file $env:RELEASE_NOTES_FILE
          }
          if ($LASTEXITCODE -ne 0) {
            throw "gh release create failed for $tag."
          }
