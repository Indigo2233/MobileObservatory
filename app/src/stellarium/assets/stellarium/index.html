<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Stellarium Web Engine</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <canvas id="stel-canvas"></canvas>
    <div id="fov-frame" aria-hidden="true"></div>
    <div id="eyepiece-fov" aria-hidden="true"></div>
    <div id="mount-reticle" aria-hidden="true">
        <span class="reticle-h"></span>
        <span class="reticle-v"></span>
        <span class="reticle-ring"></span>
    </div>
    <div id="mount-position" aria-live="polite"></div>
    <div id="engine-status">正在加载 Stellarium Web Engine…</div>
    <script
        src="./stellarium-web-engine.js"
        onerror="window.__stellariumLoadError = true">
    </script>
    <script src="./app.js"></script>
</body>
</html>
